<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wereader</title>
    <style>
      html,body,#root{height:100%;margin:0}body{background:#f5f1e8}
      #app-boot{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;background:#f5f1e8;color:#29251f;transition:opacity .22s ease,visibility .22s ease}
      #app-boot.app-boot--ready{visibility:hidden;opacity:0}
      .app-boot__content{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
      .app-boot__mark{position:relative;display:grid;width:46px;height:46px;place-items:center;border-radius:50%;background:#173f38;color:#fff;box-shadow:0 8px 24px rgba(23,63,56,.2)}
      .app-boot__mark svg{width:24px;height:24px}.app-boot__mark::after{content:"";position:absolute;inset:-7px;border:2px solid rgba(23,63,56,.18);border-top-color:#6f9459;border-radius:50%;animation:app-boot-spin .9s linear infinite}
      .app-boot__content strong{font-family:Georgia,"Songti SC",serif;font-size:17px;letter-spacing:.04em}.app-boot__content span{color:#819083;font-size:12px}
      @keyframes app-boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.app-boot__mark::after{animation:none}.app-boot__mark{opacity:.82}}
      html[data-boot-theme="dark"] body,html[data-boot-theme="dark"] #app-boot{background:#201e1a;color:#eee7da}html[data-boot-theme="voyage"] body,html[data-boot-theme="voyage"] #app-boot{background:#f1f8ed;color:#17271c}
    </style>
    <script>try{var t=localStorage.getItem("readflow-theme");if(t==="dark"||t==="voyage")document.documentElement.dataset.bootTheme=t}catch(e){}</script>
  </head>
  <body>
    <div id="app-boot" role="status" aria-live="polite"><div class="app-boot__content"><div class="app-boot__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5.5a3 3 0 0 1 3-1h5v15H6a3 3 0 0 0-3 1z"/><path d="M21 5.5a3 3 0 0 0-3-1h-5v15h5a3 3 0 0 1 3 1z"/></svg></div><strong>wereader</strong><span>正在整理你的阅读世界…</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
